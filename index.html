<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            bg: '#131314',
                            sidebar: '#1e1f20',
                            card: '#1e1f20',
                            input: '#2d2e31',
                            border: '#333538',
                            hover: '#37393e',
                            text: '#e3e3e3',
                            muted: '#c4c7c5'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444746; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555857; }
        .markdown-body pre { background: #1e1f20; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem; border: 1px solid #333538; position: relative; }
        .markdown-body code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.875rem; color: #e3e3e3; }
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #f1f3f4; }
    </style>
</head>
<body class="h-full bg-gemini-bg text-gemini-text font-sans antialiased overflow-hidden flex">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-gemini-sidebar flex flex-col transition-all duration-300 z-20 border-r border-gemini-border h-full">
        <div class="p-4 flex items-center justify-between">
            <button onclick="newChat()" class="flex items-center gap-2 bg-[#2d2e31] hover:bg-gemini-hover text-gemini-text px-4 py-2.5 rounded-full text-sm font-medium transition-colors border border-gemini-border w-full justify-center">
                <i class="fa-solid fa-plus"></i> Nuevo chat
            </button>
            <button onclick="toggleSidebar()" class="text-gemini-muted hover:text-white p-2 rounded-lg ml-2 lg:hidden">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        
        <div class="px-3 py-2 text-xs font-semibold text-gemini-muted uppercase tracking-wider">Recientes</div>
        
        <div id="chatHistoryList" class="flex-1 overflow-y-auto px-2 space-y-1"></div>

        <div class="p-4 border-t border-gemini-border flex items-center justify-between text-xs text-gemini-muted">
            <span>Groq Backend</span>
            <button onclick="clearAllChats()" class="hover:text-red-400 transition-colors" title="Borrar todo">
                <i class="fa-solid fa-trash"></i>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full relative">
        <!-- Top Bar -->
        <header class="h-14 border-b border-gemini-border flex items-center justify-between px-4 bg-gemini-bg z-10">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="text-gemini-muted hover:text-white p-2 rounded-lg">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <span class="font-medium text-lg text-white tracking-wide">AI Workspace</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-[#2d2e31] text-emerald-400 border border-gemini-border">
                    <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Llama 3.3 Versatile
                </span>
            </div>
        </header>

        <!-- Chat Container -->
        <div id="chatContainer" class="flex-1 overflow-y-auto px-4 py-6 space-y-6 flex flex-col items-center">
            <div id="welcomeScreen" class="my-auto text-center max-w-xl mx-auto space-y-4 px-4">
                <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center mx-auto text-white text-xl shadow-lg">
                    <i class="fa-solid fa-sparkles"></i>
                </div>
                <h1 class="text-3xl font-bold text-white">¿En qué puedo ayudarte hoy?</h1>
                <p class="text-gemini-muted text-sm">Pregúntame sobre código, desarrollo web o cualquier consulta técnica.</p>
            </div>

            <div id="messagesList" class="w-full max-w-3xl space-y-6 hidden"></div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-gemini-bg border-t border-gemini-border flex flex-col items-center">
            <div class="w-full max-w-3xl relative">
                <form id="chatForm" onsubmit="handleSendMessage(event)" class="bg-gemini-input rounded-2xl border border-gemini-border focus-within:border-gray-500 transition-colors flex flex-col shadow-lg">
                    <textarea id="userInput" rows="1" placeholder="Escribe un mensaje aquí..." class="w-full bg-transparent text-gemini-text placeholder-gemini-muted px-4 py-3.5 focus:outline-none resize-none max-h-48 text-sm" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
                    
                    <div class="flex items-center justify-between px-3 pb-3">
                        <div class="flex items-center gap-2 text-gemini-muted text-sm">
                            <span class="text-xs">Presiona Enter ↵ para enviar</span>
                        </div>
                        <button type="submit" id="sendButton" class="bg-white text-black hover:bg-gray-200 p-2 rounded-full w-9 h-9 flex items-center justify-center transition-colors disabled:opacity-40">
                            <i class="fa-solid fa-arrow-up text-sm"></i>
                        </button>
                    </div>
                </form>
            </div>
            <div class="text-center text-xs text-gemini-muted mt-2">
                Las respuestas son generadas por IA y pueden requerir validación.
            </div>
        </div>
    </main>

    <script>
        let chats = JSON.parse(localStorage.getItem('gemini_chats')) || [];
        let currentChatId = null;

        function initApp() {
            if (chats.length === 0) {
                newChat();
            } else {
                loadChat(chats[0].id);
            }
            renderChatHistory();
        }

        function newChat() {
            const newId = 'chat_' + Date.now();
            const newChatObj = { id: newId, title: 'Nuevo chat', messages: [] };
            chats.unshift(newChatObj);
            saveChats();
            loadChat(newId);
            renderChatHistory();
        }

        function loadChat(id) {
            currentChatId = id;
            const chat = chats.find(c => c.id === id);
            if (!chat) return;

            const messagesList = document.getElementById('messagesList');
            const welcomeScreen = document.getElementById('welcomeScreen');

            messagesList.innerHTML = '';
            if (chat.messages.length === 0) {
                welcomeScreen.classList.remove('hidden');
                messagesList.classList.add('hidden');
            } else {
                welcomeScreen.classList.add('hidden');
                messagesList.classList.remove('hidden');
                chat.messages.forEach(msg => appendMessageToDOM(msg.role, msg.content, false));
            }
            renderChatHistory();
            scrollToBottom();
        }

        function saveChats() {
            localStorage.setItem('gemini_chats', JSON.stringify(chats));
        }

        function renderChatHistory() {
            const list = document.getElementById('chatHistoryList');
            list.innerHTML = '';
            chats.forEach(chat => {
                const isActive = chat.id === currentChatId;
                const div = document.createElement('div');
                div.className = `flex items-center justify-between px-3 py-2 rounded-lg text-sm cursor-pointer transition-colors group ${isActive ? 'bg-[#37393e] text-white font-medium' : 'text-gemini-muted hover:bg-gemini-hover hover:text-white'}`;
                div.onclick = () => loadChat(chat.id);
                
                div.innerHTML = `
                    <span class="truncate flex-1 pr-2">${escapeHTML(chat.title)}</span>
                    <button onclick="event.stopPropagation(); deleteChat('${chat.id}')" class="opacity-0 group-hover:opacity-100 text-gemini-muted hover:text-red-400 p-1">
                        <i class="fa-solid fa-trash text-xs"></i>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        function deleteChat(id) {
            chats = chats.filter(c => c.id !== id);
            saveChats();
            if (chats.length === 0) {
                newChat();
            } else if (currentChatId === id) {
                loadChat(chats[0].id);
            } else {
                renderChatHistory();
            }
        }

        function clearAllChats() {
            if (confirm('¿Estás seguro de borrar todo el historial?')) {
                chats = [];
                saveChats();
                newChat();
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-ml-64');
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                document.getElementById('chatForm').requestSubmit();
            }
        }

        async function handleSendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            input.style.height = 'auto';

            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;

            if (chat.messages.length === 0) {
                chat.title = text.length > 30 ? text.substring(0, 30) + '...' : text;
            }

            chat.messages.push({ role: 'user', content: text });
            saveChats();

            document.getElementById('welcomeScreen').classList.add('hidden');
            const messagesList = document.getElementById('messagesList');
            messagesList.classList.remove('hidden');

            appendMessageToDOM('user', text, true);
            renderChatHistory();

            const assistantMsgId = 'msg_' + Date.now();
            appendMessageToDOM('assistant', '<span class="inline-block animate-pulse">Pensando...</span>', true, assistantMsgId);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: chat.messages.map(m => ({ role: m.role, content: m.content })),
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Error al conectar con el servidor.');

                const reply = data.choices[0].message.content;
                chat.messages.push({ role: 'assistant', content: reply });
                saveChats();

                const msgDiv = document.getElementById(assistantMsgId);
                if (msgDiv) {
                    const contentDiv = msgDiv.querySelector('.message-content');
                    contentDiv.innerHTML = marked.parse(reply);
                    addCopyButtonsToCodeBlocks(contentDiv);
                }
            } catch (err) {
                const msgDiv = document.getElementById(assistantMsgId);
                if (msgDiv) {
                    const contentDiv = msgDiv.querySelector('.message-content');
                    contentDiv.innerHTML = `<span class="text-red-400">Error: ${escapeHTML(err.message)}</span>`;
                }
            }
            scrollToBottom();
        }

        function appendMessageToDOM(role, content, animate = false, id = null) {
            const messagesList = document.getElementById('messagesList');
            const isUser = role === 'user';
            
            const wrapper = document.createElement('div');
            if (id) wrapper.id = id;
            wrapper.className = `flex gap-4 w-full ${isUser ? 'justify-end' : 'justify-start'} ${animate ? 'transition-all duration-300' : ''}`;

            const inner = document.createElement('div');
            inner.className = `flex gap-3 max-w-[85%] md:max-w-[75%] ${isUser ? 'flex-row-reverse' : 'flex-row'}`;

            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-full flex items-center justify-center shrink-0 text-xs font-bold ${isUser ? 'bg-blue-600 text-white' : 'bg-[#2d2e31] text-emerald-400 border border-gemini-border'}`;
            avatar.innerHTML = isUser ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-sparkles"></i>';

            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl px-4 py-3 text-sm markdown-body ${isUser ? 'bg-[#2b2d31] text-white rounded-tr-sm' : 'bg-transparent text-gemini-text w-full'}`;
            
            if (isUser) {
                bubble.textContent = content;
            } else {
                bubble.classList.add('message-content');
                bubble.innerHTML = marked.parse(content);
                addCopyButtonsToCodeBlocks(bubble);
            }

            inner.appendChild(avatar);
            inner.appendChild(bubble);
            wrapper.appendChild(inner);
            messagesList.appendChild(wrapper);
            scrollToBottom();
        }

        function addCopyButtonsToCodeBlocks(container) {
            container.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.copy-btn')) return;
                
                const btn = document.createElement('button');
                btn.className = 'copy-btn absolute top-2 right-2 bg-[#37393e] hover:bg-gray-600 text-xs text-gemini-muted hover:text-white px-2 py-1 rounded transition-colors';
                btn.innerHTML = '<i class="fa-solid fa-copy mr-1"></i> Copiar';
                
                pre.appendChild(btn);

                btn.onclick = () => {
                    const code = pre.querySelector('code') || pre;
                    navigator.clipboard.writeText(code.innerText.replace('Copiar', '').trim());
                    btn.innerHTML = '<i class="fa-solid fa-check mr-1 text-emerald-400"></i> ¡Copiado!';
                    setTimeout(() => {
                        btn.innerHTML = '<i class="fa-solid fa-copy mr-1"></i> Copiar';
                    }, 2000);
                };
            });
        }

        function scrollToBottom() {
            const container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        window.onload = initApp;
    </script>
</body>
</html>
