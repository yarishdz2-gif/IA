services:
  - type: web
    name: qyrexai-pro-max
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: QYREX_MODEL_URI
        value: hf:Qwen/Qwen2.5-7B-Instruct-GGUF:Q4_K_M
      - key: QYREX_CONTEXT
        value: "8192"
      - key: QYREX_MAX_TOKENS
        value: "1200"
    disk:
      name: qyrexai-data
      mountPath: /opt/render/project/src/data
      sizeGB: 10
