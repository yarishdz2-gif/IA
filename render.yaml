services:
  - type: web
    name: qyrexai-pro-max
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: QYREX_MODEL_ID
        value: Mozilla/Qwen2.5-0.5B-Instruct
      - key: QYREX_DTYPE
        value: q4
      - key: QYREX_MAX_TOKENS
        value: "384"
      - key: QYREX_MAX_TIME
        value: "18"
      - key: QYREX_CONTEXT_MESSAGES
        value: "10"
    disk:
      name: qyrexai-data
      mountPath: /opt/render/project/src/data
      sizeGB: 10
