services:
  - type: web
    name: qyrexai-real-gen
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: QYREX_DTYPE
        value: q4
      - key: QYREX_MAX_TOKENS
        value: "384"
      - key: QYREX_HISTORY
        value: "12"
      - key: QYREX_THREADS
        value: "4"
      - key: TRANSFORMERS_CACHE
        value: /opt/render/project/src/data/transformers-cache
    disk:
      name: qyrexai-data
      mountPath: /opt/render/project/src/data
      sizeGB: 8
