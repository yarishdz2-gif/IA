services:
  - type: web
    name: qyrexai-pro-max
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: QYREX_MODEL_URI
        value: hf:bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF:Q4_K_M
      - key: QYREX_CONTEXT
        value: "8192"
      - key: QYREX_MAX_TOKENS
        value: "900"
      - key: QYREX_ALLOW_ALL_MODELS
        value: "1"
    disk:
      name: qyrexai-data
      mountPath: /opt/render/project/src/data
      sizeGB: 10
